name: shopify-analytics-poc

x-database-env: &database-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  DBT_ENV_SECRET_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *database-env
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?Set a separate DASHBOARD_DB_PASSWORD in .env}
      PIPELINE_TRIGGER_TOKEN: ${PIPELINE_TRIGGER_TOKEN:?Set a separate random PIPELINE_TRIGGER_TOKEN in .env}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      DASHBOARD_DB_HOST: postgres
      DASHBOARD_DB_PORT: "5432"
      DASHBOARD_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?Set a separate DASHBOARD_DB_PASSWORD in .env}
      PIPELINE_API_URL: http://app:8080
      PIPELINE_TRIGGER_TOKEN: ${PIPELINE_TRIGGER_TOKEN:?Set a separate random PIPELINE_TRIGGER_TOKEN in .env}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
